[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prenly-dl"
version = "0.2.0"
description = "Laddar ner tidningsnummer från Prenly-plattformen (Textalk)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "img2pdf>=0.5",
    "pypdf>=4.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
prenly-dl = "prenly_dl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["prenly_dl"]
