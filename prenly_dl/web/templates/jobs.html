{% extends "base.html" %}
{% block title %}Jobb - prenly-dl{% endblock %}
{% block content %}
<h1>Jobb</h1>

<div class="card-actions" style="margin-bottom:1rem">
  <form method="post" action="/jobs/poll-all"><button class="secondary">Kontrollera alla nu</button></form>
</div>

<div class="chips">
  {% for varde, etikett in status_filter %}
    <a href="/jobs?status={{ varde }}" class="chip {% if varde == aktivt_filter %}chip-active{% endif %}">
      {{ etikett }} <span class="chip-count">{{ counts.get(varde, 0) }}</span>
    </a>
  {% endfor %}
</div>

{% include "jobs_table.html" %}
{% endblock %}
