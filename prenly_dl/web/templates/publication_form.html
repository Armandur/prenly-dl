{% extends "base.html" %}
{% block title %}Lägg till publikation - prenly-dl{% endblock %}
{% block content %}
<h1>Lägg till publikation</h1>

{% include "paste_form.html" %}

<p class="muted">
  Har du inga uppgifter än? <a href="/uppgifter">Hämta dem med konsolsnutten</a>.
</p>

<article>
  <h2>Fyll i för hand</h2>
  <form method="post" action="/publications">
    <div class="grid">
      <label>Namn<input name="name" value=""></label>
      <label>Sajt<input name="site" value="" placeholder="https://etidning.example.se" required></label>
    </div>
    <div class="grid">
      <label>Publikations-ID<input name="title_id" value="" required></label>
      <label>Antal senaste utgåvor att bevaka<input type="number" name="watch_limit" min="1" value="1"></label>
    </div>
    <div class="grid">
      <label>Prefix på filnamn<input name="prefix" value=""></label>
      <label>Mapp under utdatakatalogen<input name="folder" value=""></label>
    </div>
    <label>X-Textalk-Content-Client-Authorize<input name="textalk_auth" value=""></label>
    <label>Sessionstoken<input name="auth" value=""></label>
    <label>CDN (tomt = standard)<input name="cdn" value=""></label>
    <button type="submit">Lägg till</button>
  </form>
</article>
{% endblock %}
